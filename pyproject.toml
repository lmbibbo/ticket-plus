[project]
name = "ticket-plus"
version = "0.1.0"
description = "Virtual ticketing platform with a FastAPI backend and a Flask web application."
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.1",
  "email-validator==2.3.0",
  "fastapi==0.141.1",
  "flask==3.1.3",
  "gunicorn==26.2.0",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "psycopg[binary]==3.3.6",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt==2.15.1",
  "python-dotenv==1.2.3",
  "sqlalchemy==2.1.1",
  "uvicorn==0.54.0",
  "werkzeug==3.1.9",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "backend/alembic/versions", "web/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF", "S", "C4", "PTH"]
ignore = [
  # Alembic y Flask declaran fixtures por decorador; los fixtures de pytest
  # devuelven generadores y las anotaciones de sobrescrituraFBT no aplican.
  "ANN401",
]

[tool.ruff.lint.per-file-ignores]
# `S101` (assert) y `S106` (literal usado como contrasena) son el lenguaje de una
# prueba: comprobar que algo vale es un assert, y una contrasena de prueba tiene
# que ser un literal o no se estaria probando el formulario sino una variable.
"**/tests/*" = ["S101", "S106"]
"backend/alembic/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend", "web"]
# Las pruebas viven dentro de cada paquete (`ticket_api.tests`, `ticket_web.tests`)
# porque con un `tests/` de nivel raiz en los dos proyectos, mypy las resolveria
# al mismo modulo `tests.*` y `mypy backend web` abortaria con "Duplicate module".
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["ticket_api.tests.*", "ticket_web.tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/ticket_api/tests", "web/ticket_web/tests"]
pythonpath = ["backend", "web"]
addopts = "-ra --strict-markers"
markers = [
  "concurrency: pruebas que compiten por el mismo inventario (etiqueta -m concurrency)",
]
filterwarnings = ["error::DeprecationWarning:ticket_api.*", "error::DeprecationWarning:ticket_web.*"]
