schema: spec-driven

context: |
  Tech stack:
  - Backend API: Python with FastAPI, Pydantic v2, SQLAlchemy 2, and Alembic.
  - Web frontend: Flask 3 with Jinja2 and HTMX, using server-side rendering.
  - Persistence: PostgreSQL.
  - Testing: pytest.
  - The backend and the frontend are separate applications.
  - Dockerization: Dockerize everything that can be dockerized, for example the database. Prefer containerized services for local development and reproducibility.
  Git workflow:
  - Each change is developed on a `feature/<change-name>` branch.
  - Direct commits or pushes to `main` are not allowed.
  Language:
  - The user writes in Spanish; the agent ALWAYS replies in English.
  - This applies to chat, code comments, commit messages, and any generated
    artifact (proposal, design, specs, tasks).

rules:
  proposal:
    - Include rollback plan
  specs:
    - Use Given/When/Then format for scenarios
  design:
    - Include sequence diagrams for complex flows
  language:
    - The user writes in Spanish; the agent MUST always reply in English.
    - All code, code comments, commit messages, PR descriptions, and OpenSpec
      artifacts (proposal, design, specs, tasks) MUST be written in English.

operations:
  archive:
    guidance:
      - Run the archive on the current feature branch, never on `main`.
      - A single commit containing the code, tests, synced specs, and archive.
      - Run `openspec validate --specs --strict` before committing.
      - git push -u origin <branch> and then gh pr create --base main.
      - If the branch already has an open PR, do not create another one.      

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
