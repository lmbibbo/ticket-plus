[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Separador de `prepend_sys_path`. Sin esto Alembic avisa de que va a usar el
# reparto heredado por espacios, comas y dos puntos, que parte `path` al primer
# separador que encuentre.
path_separator = os
# El DSN real lo resuelve ticket_api.config; se deja vacio a proposito.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
